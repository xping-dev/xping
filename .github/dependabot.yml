# Keeps pinned versions current: action SHAs, NuGet packages (Central Package Management),
# the container base image digest and the .NET SDK in global.json.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      microsoft-extensions:
        patterns: ['Microsoft.Extensions.*', 'System.*']
      test:
        patterns: ['xunit*', 'Moq', 'NSubstitute', 'WireMock.Net', 'AwesomeAssertions']

  # Stay on the .NET 10 LTS line: patches and minors only. The move to the next LTS (.NET 12) is a
  # deliberate change of global.json, the target framework and this base image together.
  - package-ecosystem: docker
    directory: /packaging/container
    schedule:
      interval: weekly
    ignore:
      - dependency-name: dotnet/runtime-deps
        update-types: ['version-update:semver-major']

  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
