name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # The release workflow runs the same checks before it builds anything.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Xping.slnx

      - name: Build
        run: dotnet build Xping.slnx -c Release --no-restore

      # Wall-clock performance budgets are calibrated on ubuntu-latest. The Windows runner is slower,
      # and the budgets must not be loosened to fit it, so they are left out there only.
      - name: Test
        shell: bash
        env:
          OS: ${{ matrix.os }}
        run: |
          filter=()
          if [ "$OS" = "windows-latest" ]; then filter=(--filter-not-trait "Category=Performance"); fi
          dotnet test --solution Xping.slnx -c Release --no-build "${filter[@]}"

  format:
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: dotnet format
        run: dotnet format Xping.slnx --verify-no-changes
